<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Union 管理面板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:#f5f5f5;color:#333;line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:2rem 1rem}
h1{text-align:center;margin-bottom:1.5rem}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1.1rem;margin-bottom:1rem}
input[type="text"],input[type="password"]{width:100%;padding:.6rem .8rem;border:1px solid #dcdfe6;border-radius:4px;font-size:.95rem;outline:none}
input:focus{border-color:#409eff}
button{display:inline-block;padding:.6rem 1.2rem;border:none;border-radius:4px;font-size:.95rem;cursor:pointer;transition:opacity .2s;background:#409eff;color:#fff}
button:hover{opacity:.8}
button:disabled{opacity:.5;cursor:not-allowed}
button.danger{background:#f56c6c}
.row{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
.row input{flex:1}
.msg{padding:.75rem 1rem;border-radius:4px;margin-top:.5rem}
.msg-ok{background:#f0f9eb;border:1px solid #e1f3d8;color:#67c23a}
.msg-err{background:#fef0f0;border:1px solid #fde2e2;color:#f56c6c}
.msg-info{background:#ecf5ff;border:1px solid #d9ecff;color:#409eff}
.hidden{display:none}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem .75rem;text-align:left;border-bottom:1px solid #ebeef5}
th{font-weight:600;background:#fafafa}
label{display:flex;align-items:center;gap:.5rem;margin:.5rem 0}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.status-item{padding:.5rem .75rem;border:1px solid #ebeef5;border-radius:4px}
.status-item span{color:#909399;font-size:.85rem}
.status-item strong{display:block;font-size:1rem}
</style>
</head>
<body>
<div class="container">
  <h1>Union 管理面板</h1>

  <div class="card" id="login-card">
    <h2>登录</h2>
    <div class="row">
      <input type="password" id="api-key-input" placeholder="输入 Admin API Key">
      <button id="login-btn">登录</button>
    </div>
    <div id="login-msg" class="msg hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>状态概览</h2>
      <div class="status-grid" id="status-grid"></div>
      <button id="refresh-status" style="margin-top:.5rem">刷新</button>
    </div>

    <div class="card">
      <h2>角色同步</h2>
      <p style="color:#909399;margin-bottom:.5rem">将全站角色推送到 Union Hub</p>
      <button id="sync-btn">全站同步</button>
      <div id="sync-msg" class="msg hidden"></div>
    </div>

    <div class="card">
      <h2>Union 管理</h2>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button id="update-list-btn">拉取服务器列表</button>
        <button id="update-key-btn">拉取私钥</button>
        <button id="diagnose-btn">诊断</button>
      </div>
      <div id="union-msg" class="msg hidden"></div>
    </div>

    <div class="card">
      <h2>密钥管理</h2>
      <p style="color:#909399;margin-bottom:.5rem">当前指纹: <code id="current-fp">加载中...</code></p>
      <label><input type="checkbox" id="confirm-regen"> 确认轮换签名密钥（所有已签发令牌将失效）</label>
      <button id="regen-btn" class="danger" disabled>轮换密钥</button>
      <div id="keypair-msg" class="msg hidden"></div>
    </div>

    <div class="card">
      <h2>黑名单管理</h2>
      <button id="load-blacklist-btn">查询黑名单</button>
      <table id="blacklist-table" class="hidden">
        <thead><tr><th>ID</th><th>详情</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
      <div id="blacklist-msg" class="msg hidden"></div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
